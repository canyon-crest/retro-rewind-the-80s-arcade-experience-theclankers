<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <title>Q5Play Game</title>
  </head>
  <body>
    <main></main>
    <div id="game-hud" class="game-hud" aria-live="polite">
      <div id="hp-display">HP: 5/5</div>
      <div id="kill-display">Kills: 0</div>
    </div>
    <div id="game-over-overlay" class="game-over-overlay" hidden>
      <section class="game-over-panel" aria-labelledby="game-over-title">
        <h1 id="game-over-title">GAME OVER</h1>
        <p id="final-kills">Kills: 0</p>
        <p>Reload to try again</p>
      </section>
    </div>
    <div id="start-overlay" class="start-overlay">
      <section class="start-panel" aria-labelledby="start-title">
        <h1 id="start-title">RETRO REWIND</h1>
        <p>Press start to begin</p>
        <p class="start-controls">Move: arrow keys | Jump: Z | Attack: X</p>
        <button id="start-button" class="start-button" type="button">
          Start
        </button>
      </section>
    </div>
    <button id="debug-toggle" class="debug-toggle" type="button" aria-pressed="false">
      Debug: Off
    </button>
    <!-- ONLINE LINKS -->
    <script type="module" src="https://q5js.org/q5.js"></script>
    <script type="importmap">
      { "imports": {
        "box2d3-wasm": "https://q5play.org/Box2D.deluxe.mjs"
      } }
    </script>
    <script type="module" src="https://q5play.org/q5play.js"></script>

    <!-- YOUR SKETCH -->
    <script type="module" src="./assets/scripts/sketch.js"></script>
  </body>
</html>
